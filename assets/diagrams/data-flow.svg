ill="#94a3b8">competes only with enough text</text><text x="585" y="728" font-family="'Courier Prime Code','Special Elite',monospace" font-size="10.5" fill="#94a3b8">len ≥ max(10, 30 % of ML Kit)</text><text x="537" y="768" text-anchor="middle" font-family="'Courier Prime Code','Special Elite',monospace" font-size="12" fill="#0284c7">auto → ML Kit first · conf ≥ 0.70 accepted without Tesseract</text><text x="537" y="788" text-anchor="middle" font-family="'Courier Prime Code','Special Elite',monospace" font-size="12" fill="#0284c7">else Tesseract runs; the better valid reading wins</text><text x="537" y="808" text-anchor="middle" font-family="'Courier Prime Code','Special Elite',monospace" font-size="12" fill="#b91c1c">winner &lt; 0.45 → empty text → readable “photo likely misread”</text><text x="537" y="828" text-anchor="middle" font-family="'Courier Prime Code','Special Elite',monospace" font-size="12" fill="#0284c7">fa / ar / ru → Tesseract only · en … tr → ML Kit only</text><text x="537" y="848" text-anchor="middle" font-family="'Courier Prime Code','Special Elite',monospace" font-size="11.5" fill="#94a3b8">macOS / iOS → Apple Vision · image never leaves memory</text><path d="M 537,860 L 537,888" fill="none" stroke="#0284c7" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow-0284c7)"/><text x="555" y="884" font-family="'Courier Prime Code','Special Elite',monospace" font-size="14" fill="#64748b">recognized text</text><rect x="277.0" y="896" width="520" height="110" rx="20" fill="#fff5e0" stroke="#d97706" stroke-width="3"/><text x="537" y="936" text-anchor="middle" font-family="'Comic Mono','Chalkboard SE','Comic Sans MS',cursive" font-size="24" fill="#0f172a" font-weight="bold" letter-spacing="1">3.0  Translate Router</text><text x="537" y="962" text-anchor="middle" font-family="'Courier Prime Code','Special Elite',monospace" font-size="13.5" fill="#d97706">switching_translation_service · reads the stored provider</text><path d="M 537,1006 L 537,103